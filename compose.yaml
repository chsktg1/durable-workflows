services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: durable_workflows
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["workflow-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d durable_workflows"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  workflow-data:
